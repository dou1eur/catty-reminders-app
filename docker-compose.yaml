services:
  web:
    build: .
    ports:
      - "8181:8181"
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql+pymysql://app_user:app_password@db:3306/catty_reminders
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: catty_reminders
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
