name: CI - Unit Tests

on:
  push:
    branches:
      - main
      - github-actions
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright fastapi uvicorn jinja2

      - name: Install browsers (for UI tests)
        run: |
          python -m playwright install chromium
      
      - name: Start FastAPI app      
        run: |      
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 &      
          sleep 5  
      
      - name: Run all tests
        run: |
          echo "Running all test suites..."
          python -m pytest -v --browser chromium tests || exit 1

      - name: Run individual test types (for clarity)
        run: |
          echo "Running Unit Tests"
          python -m pytest -v tests/test_unit.py || echo "Unit tests failed"
          echo "Running API Tests"
          python -m pytest -v tests/test_api.py || echo "API tests failed"
          echo "Running UI Tests"
          python -m pytest -s -v --browser chromium tests/test_ui.py || echo "UI tests failed"
