name: CI - Test Application

on:
  push:
    branches: [ "github-actions", "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m pytest tests/test_unit.py -v

    - name: Run conftest validation
      run: |
        python -m pytest tests/ -k "unit" -v  # Запускаем только unit тесты
        # Проверяем что conftest.py работает
        python -c "import tests.conftest; print('✅ conftest.py imports successfully')"

    - name: Test completion report
      run: |
        echo "✅ CI tests completed successfully!"
        echo "Tests executed: Unit tests, conftest validation"
