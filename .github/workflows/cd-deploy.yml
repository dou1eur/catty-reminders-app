name: CD - Deploy with Docker Compose

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'multicontainers'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions

      - name: Deploy with Docker Compose to VM
        run: |
          echo "Starting Docker Compose deployment..."
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -i ~/.ssh/github_actions \
              -p 2470 \
              yakova@course.prafdin.ru "
            echo 'Logging in to GHCR...'
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u dou1eur --password-stdin
            
            echo 'Navigating to project directory...'
            cd ~/multicontainers
            
            echo 'Pulling latest images...'
            docker compose pull || true
            
            echo 'Stopping and removing old containers...'
            docker compose down
            
            echo 'Starting new containers with Docker Compose...'
            docker compose up -d --build
            
            echo 'Waiting for services to start...'
            sleep 30
            
            echo 'Checking application health...'
            if curl -fs http://localhost:8181/ > /dev/null; then
              echo 'Deployment successful!'
              echo 'Containers status:'
              docker compose ps
            else
              echo 'Health check failed'
              docker compose logs --tail=50
              exit 1
            fi
            
            echo 'Cleaning up...'
            docker image prune -f
          "
