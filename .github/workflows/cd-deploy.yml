name: CD - Deploy via Docker Compose

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Login to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u dou1eur --password-stdin
            
            echo "Pull latest images"
            docker compose -f ~/multicontainers/docker-compose.yml pull
            
            echo "Start services"
            docker compose -f ~/multicontainers/docker-compose.yml up -d
            
            echo "Check health"
            curl -f http://localhost:8181/ && echo "Deployment successful" || echo "Failed"
