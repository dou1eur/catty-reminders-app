name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/catty-reminders-app
            git checkout github-actions
            git pull origin github-actions
            source venv/bin/activate || python3 -m venv venv && source venv/bin/activate
            pip install -r requirements.txt
            
            # Stop previous uvicorn process
            uvicorn_pid=$(pgrep -f "uvicorn app.main:app --host 0.0.0.0 --port 8181")
            if [ ! -z "$uvicorn_pid" ]; then
              kill $(pgrep -P $uvicorn_pid)
              kill $uvicorn_pid
              sleep 2
            fi
            
            # Start new process
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 --reload &
            sleep 5
