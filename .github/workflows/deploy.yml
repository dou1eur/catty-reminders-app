name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Logging in to GHCR with repository token..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Pulling image from registry"
            docker pull ghcr.io/${{ github.repository_owner }}/catty-reminders-app:latest
            
            echo "Stopping old container"
            docker stop catty-reminders || true
            docker rm catty-reminders || true
            
            echo "Freeing port 8181 without sudo"
            pkill -f "uvicorn" || true
            pkill -f "python.*8181" || true
            sleep 5
            
            echo "Checking port status"
            ss -tlnp | grep :8181 && echo "Warning: Port may still be in use" || echo "Port is free"
            
            echo "Starting new container"
            docker run -d \
              --name catty-reminders \
              --restart unless-stopped \
              -p 8181:8181 \
              -e PYTHONUNBUFFERED=1 \
              ghcr.io/${{ github.repository_owner }}/catty-reminders-app:latest
            
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8181/ > /dev/null 2>&1; then
                echo "Deployment successful - app is running" 
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed" 
            docker logs --tail 50 catty-reminders || true
            exit 1
