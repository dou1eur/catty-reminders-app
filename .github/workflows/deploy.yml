name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/catty-reminders-app
            
            # Update code
            git pull origin github-actions
            
            # Restart application using systemd or pm2 would be better, 
            # but for now just kill and restart
            pkill -f "uvicorn app.main:app" || true
            sleep 5
            
            # Start application
            nohup venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
            
            # Wait and check
            sleep 10
            curl -f http://localhost:8181/ && echo "Deployment successful"
