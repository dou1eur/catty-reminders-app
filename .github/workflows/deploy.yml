name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/catty-reminders-app
            
            # Stop any existing processes
            echo "Stopping existing processes..."
            pkill -f "uvicorn" || true
            sleep 3
            
            # Update code
            echo "Updating code..."
            git pull origin github-actions
            
            # Create fresh virtual environment
            echo "Creating fresh virtual environment..."
            rm -rf venv
            python3 -m venv venv
            source venv/bin/activate
            
            # Install dependencies in clean environment
            echo "Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Start application
            echo "Starting application..."
            nohup venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
            
            # Wait and verify
            sleep 10
            echo "Verifying deployment..."
            if curl -f http://localhost:8181/; then
              echo "Deployment successful"
            else
              echo "Deployment failed - checking logs..."
              tail -20 app.log
              exit 1
            fi
