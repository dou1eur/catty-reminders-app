name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/catty-reminders-app
            
            # Stop existing application
            pkill -f "uvicorn app.main:app" || true
            sleep 3
            
            # Update code
            git pull origin github-actions
            
            # Setup virtual environment
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Install dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Start application
            nohup venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
            
            # Wait for startup
            sleep 10
            
            # Verify application is running
            if pgrep -f "uvicorn app.main:app" > /dev/null; then
              echo "Application deployed successfully"
              curl -f http://localhost:8181/ || echo "Application starting"
            else
              echo "Application failed to start"
              tail -20 app.log
              exit 1
            fi
