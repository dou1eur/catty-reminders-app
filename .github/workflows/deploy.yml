name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            IMAGE="ghcr.io/${{ github.repository_owner }}/catty-reminders:latest"
            
            echo "Pulling $IMAGE"
            docker pull "$IMAGE"
            
            echo "Stopping old container (if exists)"
            docker stop catty-reminders || true
            docker rm catty-reminders || true
            
            echo "Checking port 8181 usage"
            if ss -tlnp | grep :8181; then
              echo "Port 8181 is in use, finding process..."
              PID=$(ss -tlnp | grep :8181 | awk '{print $6}' | cut -d',' -f2 | cut -d'=' -f2)
              if [ ! -z "$PID" ]; then
                echo "Killing process $PID"
                kill $PID || true
                sleep 2
              fi
            else
              echo "Port 8181 is free"
            fi
            
            echo "Starting new container"
            docker run -d \
              --name catty-reminders \
              --restart unless-stopped \
              -p 8181:8181 \
              -e PYTHONUNBUFFERED=1 \
              "$IMAGE"
            
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8181/ > /dev/null 2>&1; then
                echo "App is healthy and running" 
                exit 0
              fi
              sleep 2
            done

            echo "App health check failed" 
            docker logs --tail 50 catty-reminders || true
            exit 1
