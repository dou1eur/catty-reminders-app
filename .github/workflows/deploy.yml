name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== DEPLOYMENT ==="
            echo "Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u dou1eur --password-stdin
            
            echo "Pulling image"
            docker pull ghcr.io/dou1eur/catty-reminders-app:latest
            
            echo "Stopping ALL containers using port 8181"
            # Останавливаем все контейнеры использующие порт 8181
            docker ps --filter "publish=8181" --format "{{.ID}}" | xargs -r docker stop
            docker ps -a --filter "publish=8181" --format "{{.ID}}" | xargs -r docker rm
            
            echo "Alternative: stop all running containers"
            docker ps -q | xargs -r docker stop
            
            sleep 5
            
            echo "Starting new container"
            docker run -d \
              --name catty-reminders \
              --restart unless-stopped \
              -p 8181:8181 \
              -e PYTHONUNBUFFERED=1 \
              ghcr.io/dou1eur/catty-reminders-app:latest
            
            echo "Waiting for app..."
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8181/ > /dev/null 2>&1; then
                echo "Deployment successful" 
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed" 
            docker logs --tail 50 catty-reminders || true
            exit 1
