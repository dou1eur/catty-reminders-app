name: CD - Deploy FastAPI App

on:
  release:
    types: 
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          port: 2470
          username: yakova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== DEPLOYMENT DEBUG ==="
            echo "Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u dou1eur --password-stdin
            
            echo "Pulling image"
            docker pull ghcr.io/dou1eur/catty-reminders-app:latest
            
            echo "Cleaning up old containers"
            docker stop catty-reminders || true
            docker rm catty-reminders || true
            
            echo "Testing the image"
            docker run --rm -it \
              --name test-container \
              ghcr.io/dou1eur/catty-reminders-app:latest \
              python -c "import app.main; print('Import successful')"
            
            echo "Starting container in foreground to see logs"
            timeout 30s docker run --rm \
              --name catty-reminders \
              -p 8181:8181 \
              -e PYTHONUNBUFFERED=1 \
              ghcr.io/dou1eur/catty-reminders-app:latest || true
            
            echo "Checking what's in the image"
            docker run --rm -it \
              ghcr.io/dou1eur/catty-reminders-app:latest \
              ls -la app/ || echo "No app directory"
            
            echo "Trying to start with shell to debug"
            docker run --rm -it \
              --entrypoint /bin/bash \
              ghcr.io/dou1eur/catty-reminders-app:latest
